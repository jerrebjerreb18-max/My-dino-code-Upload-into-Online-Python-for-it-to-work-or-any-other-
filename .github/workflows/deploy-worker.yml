name: Deploy ERLC backend and website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: potential-millionaires-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check required private settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          ERLC_KEY_ENCRYPTION_SECRET: ${{ secrets.ERLC_KEY_ENCRYPTION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -eu
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_BOT_TOKEN DISCORD_OAUTH_CLIENT_SECRET ERLC_KEY_ENCRYPTION_SECRET TURNSTILE_SECRET_KEY; do
            case "$name" in
              CLOUDFLARE_API_TOKEN) value=$CLOUDFLARE_API_TOKEN ;;
              CLOUDFLARE_ACCOUNT_ID) value=$CLOUDFLARE_ACCOUNT_ID ;;
              DISCORD_BOT_TOKEN) value=$DISCORD_BOT_TOKEN ;;
              DISCORD_OAUTH_CLIENT_SECRET) value=$DISCORD_OAUTH_CLIENT_SECRET ;;
              ERLC_KEY_ENCRYPTION_SECRET) value=$ERLC_KEY_ENCRYPTION_SECRET ;;
              TURNSTILE_SECRET_KEY) value=$TURNSTILE_SECRET_KEY ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Add the $name Actions secret before running this workflow."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Verify Discord bot token and server access
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const token = String(process.env.DISCORD_BOT_TOKEN || "").trim();
          const config = await readFile("worker/wrangler.toml", "utf8");
          const clientId = config.match(/^DISCORD_OAUTH_CLIENT_ID\s*=\s*"([0-9]+)"/m)?.[1];
          const guildId = config.match(/^DISCORD_GUILD_ID\s*=\s*"([0-9]+)"/m)?.[1];
          if (!token) throw new Error("DISCORD_BOT_TOKEN is empty.");
          if (!clientId || !guildId) throw new Error("Set valid Discord client and server IDs in worker/wrangler.toml.");

          const headers = { authorization: "Bot " + token, accept: "application/json" };
          const botResponse = await fetch("https://discord.com/api/v10/users/@me", { headers, signal: AbortSignal.timeout(12000) });
          if (!botResponse.ok) {
            throw new Error("Discord rejected DISCORD_BOT_TOKEN (HTTP " + botResponse.status + "). Replace the GitHub Actions secret with the current raw bot token, without a 'Bot ' prefix.");
          }
          const bot = await botResponse.json();
          if (String(bot.id || "") !== clientId) throw new Error("DISCORD_BOT_TOKEN belongs to a different Discord application than DISCORD_OAUTH_CLIENT_ID.");

          const guildResponse = await fetch("https://discord.com/api/v10/guilds/" + guildId, { headers, signal: AbortSignal.timeout(12000) });
          if (!guildResponse.ok) {
            throw new Error("The bot token is valid, but Discord denied access to configured server " + guildId + " (HTTP " + guildResponse.status + "). Reinvite the correct bot and confirm DISCORD_GUILD_ID.");
          }
          console.log("Discord bot token, application ID, and configured server access verified.");
          NODE

      - name: Prepare or reuse the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node worker/scripts/prepare-deploy.mjs

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          command: d1 migrations apply potential-millionaires-erlc --remote

      - name: Deploy private API Worker
        id: worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          command: deploy
          secrets: |
            DISCORD_BOT_TOKEN
            DISCORD_OAUTH_CLIENT_SECRET
            ERLC_KEY_ENCRYPTION_SECRET
            TURNSTILE_SECRET_KEY
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          ERLC_KEY_ENCRYPTION_SECRET: ${{ secrets.ERLC_KEY_ENCRYPTION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Verify the live Worker and Turnstile configuration
        id: verify
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const raw = String(process.env.WORKER_URL || "").trim();
          let origin;
          try {
            const parsed = new URL(raw);
            if (parsed.protocol !== "https:" || parsed.username || parsed.password) throw new Error();
            origin = parsed.origin;
          } catch {
            throw new Error("Cloudflare did not return a valid HTTPS Worker URL.");
          }

          let health;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              const response = await fetch(origin + "/health", { signal: AbortSignal.timeout(10000) });
              health = await response.json();
              if (response.ok && health.ready === true) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!health || health.ready !== true) throw new Error("The deployed Worker did not become ready. Check the deployment logs and Cloudflare permissions.");

          const captchaResponse = await fetch(origin + "/security/config", { signal: AbortSignal.timeout(10000) });
          const captcha = await captchaResponse.json().catch(() => ({}));
          if (!captchaResponse.ok || captcha.enabled !== true || !captcha.siteKey) {
            throw new Error("The Worker is healthy, but Turnstile is not configured: " + String(captcha.error || captchaResponse.status));
          }
          const expectedRedirect = origin + "/auth/discord/callback";

          await appendFile(process.env.GITHUB_OUTPUT, "worker_url=" + origin + "\n");
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            "## Backend deployment is ready",
            "",
            "- Worker: " + origin,
            "- Discord OAuth redirect URI: " + expectedRedirect,
            "- The Turnstile public configuration endpoint passed its live check.",
            "",
            "Add the exact redirect URI above in the Discord Developer Portal under OAuth2 → Redirects, then reload the dashboard.",
            "",
          ].join("\n"));
          console.log("Worker health and Turnstile configuration checks passed.");
          NODE

      - name: Set the public dashboard backend URL
        env:
          WORKER_URL: ${{ steps.verify.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const url = new URL(process.env.WORKER_URL);
          if (url.protocol !== "https:" || url.pathname !== "/" || url.search || url.hash) {
            throw new Error("Expected an HTTPS Worker origin.");
          }
          const contents = "// Public API origin only. Never place bot tokens, OAuth secrets, or the ER:LC key here.\n" +
            "window.PM_API_BASE_URL = " + JSON.stringify(url.origin) + ";\n";
          await writeFile("dashboard-config.js", contents, "utf8");
          NODE

      - name: Commit generated public configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-config.js worker/wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Configure deployed ERLC backend"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the configured website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish the website
        id: pages-deployment
        uses: actions/deploy-pages@v4
