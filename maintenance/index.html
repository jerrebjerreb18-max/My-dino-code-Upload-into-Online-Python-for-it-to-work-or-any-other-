<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#10141b">
  <title>Temporarily offline — Potential Millionaires</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#10141b;color:#f2f5f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,620px);padding:clamp(28px,6vw,52px);border:1px solid #293340;border-radius:20px;background:#171d26;box-shadow:0 24px 80px #0005}
    .mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#c8f06a;color:#10141b;font-weight:900;letter-spacing:-.08em}
    p{color:#aab6c3;line-height:1.7}
    h1{margin:26px 0 12px;font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.04em}
    .status{display:inline-flex;align-items:center;gap:8px;color:#c8f06a;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:#c8f06a}
    footer{margin-top:32px;padding-top:18px;border-top:1px solid #293340;color:#748190;font-size:12px}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">PM</span>
    <p class="status"><span class="dot" aria-hidden="true"></span> Temporarily offline</p>
    <h1>We’ll be back.</h1>
    <p>The Potential Millionaires website and dashboard are temporarily unavailable while we review the Terms of Service and Privacy Policy. Sign-in and dashboard features are offline during this review.</p>
    <footer>Potential Millionaires</footer>
  </main>
</body>
</html>
